line-length = 100
target-version = "py314"
src = [".", "backend"]
extend-exclude = ["backend/migrations/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S"]
ignore = ["S101", "E501"]  # the formatter owns line length

[lint.per-file-ignores]
"backend/tests/*" = ["S"]
"tests_ha/*" = ["S"]
