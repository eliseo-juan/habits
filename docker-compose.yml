services:
  habits:
    image: ghcr.io/eliseo-juan/habits:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HABITS_SECRET_KEY: ${HABITS_SECRET_KEY:?set a long random value}
      HABITS_PUBLIC_URL: ${HABITS_PUBLIC_URL:-http://localhost:8000}
    volumes:
      - ./data:/data
