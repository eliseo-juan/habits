name: 🚀 Mobile OTA update

# Publishes JS-only changes to installed apps through EAS Update. Runs only on pushes to main (never on pull
# requests, so forks cannot reach the secrets) and inside the `production` GitHub environment, where you can
# also require a manual approval. Needs the repo/environment secrets EXPO_TOKEN and EAS_PROJECT_ID.
# Android only: there is no iOS build, so iOS updates would reach nobody.
# When a change alters the native fingerprint, no installed APK can take the new update, so the job first queues a
# `production` build for that runtime (unless one already exists or is in progress) and links it in the run summary.
# The runtime is computed by `eas fingerprint:generate` (see .github/actions/mobile-eas), the same code EAS runs.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "!mobile/**/*.md"]
  workflow_dispatch:

concurrency:
  group: mobile-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: eas update (production, android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Forks have no secrets (and no business publishing); the job only runs in the owner's repository.
    if: github.repository == 'eliseo-juan/habits'
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mobile-eas
        id: eas
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          expo-token: ${{ secrets.EXPO_TOKEN }}
          eas-project-id: ${{ secrets.EAS_PROJECT_ID }}
      - run: npm run typecheck
      - name: Queue an APK build if no build has this runtime
        # Before publishing: if this runner's runtime ever differed from the EAS builder's, the build fails here
        # ("Runtime version mismatch") instead of after an update nobody can receive.
        env:
          RUNTIME: ${{ steps.eas.outputs.runtime }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: ../.github/scripts/ensure-android-build.sh production "$RUNTIME"
      - name: Publish the update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          RUNTIME: ${{ steps.eas.outputs.runtime }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          eas update --channel production --environment production --platform android --non-interactive --json \
            --message "$COMMIT_MESSAGE" > "$RUNNER_TEMP/update.json"
          published=$(node -p 'const s = require("fs").readFileSync(process.argv[1], "utf8"); JSON.parse(s.slice(s.search(/[\[{]/)))[0].runtimeVersion' "$RUNNER_TEMP/update.json")
          if [ "$published" != "$RUNTIME" ]; then
            echo "::error::The update was published for runtime $published but this runner computed $RUNTIME"
            exit 1
          fi
