name: Mobile OTA update

# Publishes JS-only changes to installed apps through EAS Update. Runs only on pushes to main (never on pull
# requests, so forks cannot reach the secrets) and inside the `production` GitHub environment, where you can
# also require a manual approval. Needs the repo/environment secrets EXPO_TOKEN and EAS_PROJECT_ID.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "!mobile/**/*.md"]
  workflow_dispatch:

concurrency:
  group: mobile-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: eas update (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Forks have no secrets (and no business publishing); the job only runs in the owner's repository.
    if: github.repository == 'eliseo-juan/habits'
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm install --global eas-cli@27.7.2
      - run: eas update --channel production --environment production --non-interactive --message "$COMMIT_MESSAGE"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
