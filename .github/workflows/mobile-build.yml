name: 🚀 Mobile APK build

# Manual only: Actions tab → "🚀 Mobile APK build" → Run workflow. Queues an Android build on EAS and links it in the
# run summary; it does not wait for the build, so it costs almost no runner time. If this commit's runtime already has
# a build (finished or in progress) nothing is queued unless "force" is ticked. 🚀 Mobile OTA update already queues a
# build by itself whenever a push changes the native layer, so this is for rebuilding on demand. Uses the same secrets as the OTA
# workflow (EXPO_TOKEN, EAS_PROJECT_ID) inside the `production` environment. The first build must be made once from a
# terminal (`eas build --profile production --platform android`) so EAS can create and store the signing keystore;
# non-interactive builds cannot generate it.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (production or preview; both build an APK)
        type: choice
        options: [production, preview]
        default: production
      force:
        description: Queue a build even if this runtime already has one
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: eas build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'eliseo-juan/habits'
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mobile-eas
        id: eas
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          expo-token: ${{ secrets.EXPO_TOKEN }}
          eas-project-id: ${{ secrets.EAS_PROJECT_ID }}
      - name: Queue the build
        env:
          PROFILE: ${{ inputs.profile }}
          FORCE: ${{ inputs.force }}
          RUNTIME: ${{ steps.eas.outputs.runtime }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: ../.github/scripts/ensure-android-build.sh "$PROFILE" "$RUNTIME" "$FORCE"
