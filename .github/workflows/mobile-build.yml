name: 🚀 Mobile APK build

# Manual only: Actions tab → "🚀 Mobile APK build" → Run workflow. Queues an Android build on EAS and links it in the
# run summary; it does not wait for the build, so it costs almost no runner time. Uses the same secrets as the OTA
# workflow (EXPO_TOKEN, EAS_PROJECT_ID) inside the `production` environment. The first build must be made once from a
# terminal (`eas build --profile production --platform android`) so EAS can create and store the signing keystore;
# non-interactive builds cannot generate it.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (production or preview; both build an APK)
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

jobs:
  build:
    name: eas build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'eliseo-juan/habits'
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm install --global eas-cli@27.7.2
      - name: Restore google-services.json
        # Its contents are part of the runtime fingerprint, so this runner needs the same file EAS has.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - name: Queue the build
        env:
          PROFILE: ${{ inputs.profile }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait --json | tee build.json
          url=$(node -e 'const b=JSON.parse(require("fs").readFileSync("build.json","utf8"));console.log((Array.isArray(b)?b[0]:b).buildDetailsPageUrl ?? "")')
          {
            echo "### Android build queued ($PROFILE)"
            echo
            echo "${url:-See expo.dev → Builds}"
            echo
            echo "Open that page on your phone when it finishes and download the .apk."
          } >> "$GITHUB_STEP_SUMMARY"
