name: ✅ CI

# Entry point for every check. `🔎 Changes` decides which component workflows run, and `CI ok` always reports, so it
# is the single required status for main whatever a PR touches. Tags and manual runs check everything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes the run in flight (never cancels main/tags: they publish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  changes:
    name: 🔎 Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.backend == 'true' }}
      web: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.web == 'true' }}
      mobile: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.mobile == 'true' }}
      home-assistant: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.home-assistant == 'true' }}
      image: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.image == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'ruff.toml'
              - '.github/workflows/backend.yml'
            web:
              - 'web/**'
              - '.github/workflows/web.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile.yml'
            home-assistant:
              - 'custom_components/**'
              - 'tests_ha/**'
              - 'hacs.json'
              - 'ruff.toml'
              - '.github/workflows/home-assistant.yml'
            image:
              - 'backend/**'
              - 'web/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker.yml'

  backend:
    name: 🐍 Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  web:
    name: 🌐 Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  mobile:
    name: 📱 Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile.yml

  home-assistant:
    name: 🏠 Home Assistant
    needs: changes
    if: needs.changes.outputs.home-assistant == 'true'
    uses: ./.github/workflows/home-assistant.yml

  image:
    name: 🐳 Docker image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/docker.yml

  # Single required status for the main ruleset: green when every component that ran passed (skipped is fine).
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, backend, web, mobile, home-assistant, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi

  publish:
    name: 🚀 Publish image
    needs: [changes, ci-ok]
    # !cancelled(): a skipped component job upstream of ci-ok would otherwise skip this job on every partial run.
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.event_name == 'push' && needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/habits
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
