name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["mobile/**"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Prebuild (validates config plugins, widgets included)
        run: npx expo prebuild --no-install --platform all
        env:
          CI: "1"
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          CI: "1"
