name: 📱 Mobile

# Called from ✅ CI when mobile/ changes: typecheck, Android prebuild and JS bundle of the Expo app.
# Publishing lives in 🚀 Mobile OTA update and 🚀 Mobile APK build.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  mobile:
    name: Typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Prebuild Android (validates config plugins, widgets included)
        run: npx expo prebuild --no-install --platform android
        env:
          CI: "1"
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          CI: "1"
