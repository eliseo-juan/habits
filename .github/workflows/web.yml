name: 🌐 Web

# Called from ✅ CI when web/ changes: lint, typecheck and build (`npm run build` runs tsc) and audit of the PWA.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Lint, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
