<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hábitos con drama 52x16</title>
<style>
  :root{
    --bg:#0b0c0f; --panel:#14161b; --line:#262a33; --text:#e8eaf0; --muted:#8b92a3; --accent:#ffb020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(11,12,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px}
  h1{font-size:18px;margin:0 0 8px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
  .controls label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .controls output{display:inline-block;min-width:2ch;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{accent-color:var(--accent);width:130px}
  .presets button, details summary, #applyJson, #resetJson{
    background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  .presets button:hover{border-color:var(--accent)}
  details{margin-top:8px;font-size:13px;color:var(--muted)}
  details summary{display:inline-block}
  textarea{width:100%;height:110px;margin-top:8px;background:#0d0f13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,monospace}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px;max-width:1500px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card canvas{width:100%;aspect-ratio:52/16;border-radius:8px;display:block;background:#050505}
  .card h2{font-size:15px;margin:2px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card h2 small{font-weight:500;color:var(--accent);font-size:12px;white-space:nowrap}
  .card p{margin:0;color:var(--muted);font-size:13px}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .tag.good{color:#7bdc65;border-color:#2c5a2a}.tag.bad{color:#ff8a80;border-color:#5a2c2a}
  .star{color:var(--accent)}
  footer{padding:8px 16px 40px;text-align:center;color:var(--muted);font-size:12px}
  @media (max-width:420px){main{grid-template-columns:1fr;padding:12px}}
  .pbtn{background:var(--accent);color:#1a1200;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Hábitos: hechos vs pendientes, con drama</h1>
  <div class="controls">
    <label>Pendientes <input id="n" type="range" min="2" max="30" value="9"><output id="nO">9</output></label>
    <label>Hechos <input id="d" type="range" min="0" max="20" value="6"><output id="dO">6</output></label>
    <label>Hora <input id="h" type="range" min="7" max="24" step="0.05" value="21"><output id="hO">21:00</output></label>
    <label>Velocidad <input id="sp" type="range" min="0.4" max="2.5" step="0.1" value="1"><output id="spO">1.0</output>x</label>
    <button id="play" class="pbtn">▶ Reproducir el día</button>
    <span class="presets"><button data-h="9">9:00</button><button data-h="15">15:00</button><button data-h="19">19:00</button><button data-h="22">22:00</button><button data-h="23.6">23:36</button></span>
  </div>
</header>
<main id="grid"></main>
<footer>Misma matriz 52×16. Los hechos se quedan en verde tranquilo; los pendientes se ponen peor según avanza el día (07:00 → 24:00).</footer>

<script>
const W = 52, H = 16, P = 16;

/* ---------- datos de ejemplo ---------- */
const PALETTE = ['#ff5a5f','#ffa23a','#ffd23f','#7bdc65','#2ec4b6','#3a9bff','#8f6bff','#ff6bd6'];
const NAMES = ['Meditar','Leer','Beber agua','Gimnasio','Dormir 23h','Vitaminas','Caminar','Estirar','Diario','Inglés',
 'Fruta','Sin azúcar','Sin móvil','Ducha fría','Planificar','Dientes','Cocinar','Llamar a mamá','Código','Guitarra',
 'Yoga','Omega 3','Plantas','Ordenar','Gratitud','Respirar','Podcast','Cardio','Crema','Hilo dental'];
const SAMPLE = NAMES.map((name,i)=>({name, color:PALETTE[(i*3)%PALETTE.length], icon:i%8, streak:2+((i*7+3)%14)}));
let HABITS = SAMPLE, USING_REAL = false;

/* ---------- fuente 3x5 ---------- */
const F = {A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],H:[5,5,7,5,5],
I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,7,3],
R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
0:[7,5,5,5,7],1:[2,6,2,2,7],2:[6,1,2,4,7],3:[6,1,2,1,6],4:[5,5,7,1,1],5:[7,4,6,1,6],6:[3,4,7,5,7],7:[7,1,2,2,2],8:[7,5,7,5,7],9:[7,5,7,1,6],
'/':[1,1,2,4,4],':':[0,2,0,2,0],'.':[0,0,0,0,2],'-':[0,0,7,0,0],'!':[2,2,2,0,2],'+':[0,2,7,2,0],' ':[0,0,0,0,0]};
/* iconos 8x8 */
const ICONS = [
 [0x00,0x00,0x42,0xFF,0xFF,0x42,0x00,0x00], // pesa
 [0x00,0x66,0xBD,0xBD,0xBD,0xBD,0x7E,0x00], // libro
 [0x08,0x08,0x1C,0x1C,0x3E,0x3E,0x3E,0x1C], // gota
 [0x1C,0x38,0x70,0x70,0x70,0x70,0x38,0x1C], // luna
 [0x00,0x66,0xFF,0xFF,0xFF,0x7E,0x3C,0x18], // corazón
 [0x18,0x18,0x7E,0xFF,0x7E,0x3C,0x66,0x42], // estrella
 [0x06,0x1E,0x3E,0x7E,0x7C,0x78,0x60,0x00], // hoja
 [0x00,0x01,0x03,0x86,0xCC,0x78,0x30,0x00]  // check
];
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();

/* ---------- color ---------- */
const rgb = h => { h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
const mul = (c,k) => [c[0]*k,c[1]*k,c[2]*k];
const hsl = (h,s,l) => { h/=360; const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))}; return [f(0),f(8),f(4)]; };
const WHITE=[235,235,235], DIM=[60,60,66], BLACK=[0,0,0], AMBER=[255,176,32];
const hc = h => rgb(h.color || PALETTE[0]);

/* ---------- buffer ---------- */
class Buf{
  constructor(){this.d=new Float32Array(W*H*3);this.cx0=0;this.cx1=W}
  clear(){this.d.fill(0);this.cx0=0;this.cx1=W}
  set(x,y,c,a=1){x=Math.floor(x);y=Math.floor(y);if(x<this.cx0||x>=this.cx1||y<0||y>=H)return;const i=(y*W+x)*3,d=this.d;
    if(a>=1){d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}else{d[i]+=(c[0]-d[i])*a;d[i+1]+=(c[1]-d[i+1])*a;d[i+2]+=(c[2]-d[i+2])*a}}
  rect(x,y,w,h,c,a=1){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c,a)}
  text(s,x,y,c,sc=1){s=norm(s);for(const ch of s){const g=F[ch]||F[' '];
    for(let r=0;r<5;r++)for(let k=0;k<3;k++)if(g[r]&(4>>k))this.rect(x+k*sc,y+r*sc,sc,sc,c);x+=4*sc}return x}
  icon(bits,x,y,c,sc=1){for(let r=0;r<8;r++)for(let k=0;k<8;k++)if(bits[r]&(0x80>>k))this.rect(x+k*sc,y+r*sc,sc,sc,c)}
  clip(x0,x1){this.cx0=Math.max(0,x0);this.cx1=Math.min(W,x1)}
  unclip(){this.cx0=0;this.cx1=W}
}
const textW = (s,sc=1) => String(s).length*4*sc-sc;

/* ---------- utilidades de layout ---------- */
function layoutCells(n,x0=0,y0=0,w=W,h=H,maxS=8){
  let s=maxS;for(;s>1;s--){if(Math.floor(w/s)*Math.floor(h/s)>=n)break}
  const colsMax=Math.floor(w/s);const cols=Math.min(n,colsMax),rows=Math.ceil(n/cols);
  return {s,cols,rows,ox:x0+Math.floor((w-cols*s)/2),oy:y0+Math.floor((h-rows*s)/2),inner:s>=3?s-1:1};
}
const cellPos=(L,i)=>({x:L.ox+(i%L.cols)*L.s,y:L.oy+Math.floor(i/L.cols)*L.s});
function marquee(b,segs,x0,x1,y,sc,t,spd,fit=true){
  const tw=segs.reduce((a,g)=>a+g.s.length*4*sc,0);
  b.clip(x0,x1);
  if(fit&&tw-sc<=x1-x0){let x=x0;segs.forEach(g=>{x=b.text(g.s,x,y,g.c,sc)});}
  else{const off=(t/1000*spd*8)%tw;for(const base of [x0-off,x0-off+tw]){let x=base;segs.forEach(g=>{x=b.text(g.s,x,y,g.c,sc)})}}
  b.unclip();
}
const urgency = h => Math.max(0,Math.min(1,(h-8)/14));
const urgColor = h => hsl(120*(1-urgency(h)),1,.5);

/* ================= ESTILOS (drama) ================= */
const RED=[255,32,20];
const mixc=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const dayFrac=h=>Math.max(0,Math.min(1,(h-7)/17));
const U=h=>Math.pow(dayFrac(h),1.8);            // curva de angustia: lenta al principio, brutal al final
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pulse=(S,t,i,u)=>.5+.5*Math.sin(t/1000*6.283*(.5+4.5*u)*S.sp+i*.9);
const doneCol=(t,i)=>mul([30,130,66],.62+.12*Math.sin(t/1800+i));
const pendCol=(S,h,t,i,u)=>mul(mixc(hc(h),RED,Math.min(1,u*.9)),.4+.6*pulse(S,t,i,u));
/* dibuja la rejilla total: hechos primero (calma), pendientes después (culpa) */
function drawMap(b,S,t,reg,u,opt={}){
  const tot=S.n+S.d,L=layoutCells(tot,reg.x,reg.y,reg.w,reg.h,opt.maxS||6),cells=[];
  for(let i=0;i<tot;i++){const{x,y}=cellPos(L,i);const isDone=i<S.d,h=isDone?null:S.p[i-S.d];
    const c=isDone?doneCol(t,i):(opt.pc?opt.pc(h,i-S.d,x,y,L):pendCol(S,h,t,i,u));
    if(!opt.skip||!opt.skip(isDone,i)) b.rect(x,y,L.inner,L.inner,c);cells.push({x,y,isDone,h,i:i-S.d})}
  return {L,cells};
}
const timeBar=(b,S,t,y,u)=>{const df=dayFrac(S.h),w=Math.round(W*(1-df));
  for(let x=0;x<w;x++)b.set(x,y,mixc([40,200,90],RED,Math.min(1,u*1.1)),u>.8&&Math.random()<.15?.3:1);
  if(w<W)b.set(w,y,WHITE,.5+.5*Math.sin(t/120))};

const STYLES = [

{ id:'alarm', title:'Alarma creciente', star:1,
  desc:'Mapa del día + una línea inferior con el tiempo que queda de día. Los pendientes laten cada vez más rápido y se ponen rojos; a última hora se cuelan destellos blancos.',
  pros:['Lo más fiel a lo que pides','Se entiende sin explicar'], cons:['Sin texto: hay que fiarse de los colores'],
  render(b,S,t){const u=U(S.h);const{cells}=drawMap(b,S,t,{x:0,y:0,w:W,h:14},u);
    timeBar(b,S,t,15,u);
    if(u>.75){const p=cells.filter(c=>!c.isDone);if(p.length&&Math.random()<.18){const c=p[Math.floor(Math.random()*p.length)];b.rect(c.x,c.y,2,2,WHITE,.8)}}}},

{ id:'fire', title:'Fuego sobre las culpas', star:1,
  desc:'Cada hábito pendiente arde: la llama crece con la hora y con la racha que perderías. Los hechos, fríos y verdes, debajo.',
  pros:['Máximo drama visual','La racha añade peso a cada hábito'], cons:['Con 30 hay mucha llama a la vez'],
  render(b,S,t){const u=U(S.h);const reg={x:0,y:8,w:W,h:8};const tot=S.n+S.d,L=layoutCells(tot,reg.x,reg.y,reg.w,reg.h,4);
    for(let i=S.d;i<tot;i++){const{x,y}=cellPos(L,i),h=S.p[i-S.d];
      const inten=Math.min(1,.12+u*.95+h.streak/60);
      for(let cx=0;cx<L.inner;cx++){
        const fh=Math.round((1+inten*8)*(.55+.45*Math.sin(t/(90+cx*17)+i*3+cx*1.9)*Math.sin(t/230+i)+.2));
        for(let k=1;k<=fh;k++){const f=k/(fh+1);const c=f<.35?[255,235,120]:f<.7?[255,140,20]:[190,30,10];b.set(x+cx,y-k,mul(c,1-f*.55))}}}
    drawMap(b,S,t,reg,u,{maxS:4,pc:(h,i)=>mul(mixc(hc(h),RED,Math.min(1,u)),.55+.45*pulse(S,t,i,u))})}},

{ id:'tide', title:'Marea roja', star:1,
  desc:'El día es una marea roja que sube desde abajo (07:00 vacía, 24:00 llena). Los hechos flotan a salvo en verde; los pendientes se hunden entre destellos.',
  pros:['Cuenta atrás sin números','Muy dramático al final'], cons:['A última hora tapa casi todo'],
  render(b,S,t){const u=dayFrac(S.h),lvl=u*(H+3);
    for(let x=0;x<W;x++){const surf=H-lvl+Math.sin(x/3+t/380*S.sp)*1.3+Math.sin(x/1.7-t/260*S.sp)*.6;
      for(let y=0;y<H;y++)if(y>=surf)b.set(x,y,mul(RED,.22+.55*((y-surf)/H)),1)}
    drawMap(b,S,t,{x:0,y:0,w:W,h:H},U(S.h),{pc:(h,i)=>mul(mixc(hc(h),WHITE,.25),.5+.5*pulse(S,t,i,U(S.h)))})}},

{ id:'crumble', title:'Se desmorona', 
  desc:'Según se acaba el día, los hábitos pendientes empiezan a temblar, se agrietan y caen al suelo como brasas. Los hechos permanecen.',
  pros:['Pérdida tangible','Los hechos se ven sólidos'], cons:['A las 23:59 ya no queda nada que ver'],
  render(b,S,t){const u=U(S.h);
    drawMap(b,S,t,{x:0,y:0,w:W,h:H},u,{skip:(d)=>!d,maxS:5});
    const tot=S.n+S.d,L=layoutCells(tot,0,0,W,H,5);
    for(let k=0;k<S.n;k++){const i=S.d+k,{x,y}=cellPos(L,i),h=S.p[k],thr=.5+.45*rnd(k+1),d=u-thr;
      let c=pendCol(S,h,t,i,u),dx=0,dy=0;
      if(d>-.07&&d<=0){dx=Math.round(Math.sin(t/35+k)*1.2)}
      if(d>0){dy=Math.min(H-L.inner-y,Math.round((d*d)*900));c=mixc(c,[255,90,10],.6);if(dy>=H-L.inner-y)c=mul([200,50,10],.5+.5*Math.sin(t/200+k))}
      b.rect(x+dx,y+dy,L.inner,L.inner,c)}}},

{ id:'fuse', title:'Mecha encendida',
  desc:'Una mecha recorre el borde superior y se consume con el día. Chispas en la punta; al final todo parpadea.',
  pros:['Metáfora inmediata','Barato de dibujar'], cons:['Solo 3 filas de tamaño para la mecha'],
  render(b,S,t){const u=U(S.h),df=dayFrac(S.h),len=Math.round(W*(1-df));
    for(let x=0;x<len;x++)b.set(x,0,x%4<2?[170,110,40]:[110,70,25]);
    const hx=len;for(let k=0;k<5;k++){const sx=hx+Math.round((Math.random()-.5)*5),sy=Math.round(Math.random()*3);b.set(sx,sy,k<2?WHITE:[255,170,40],1)}
    b.set(hx,0,WHITE);
    drawMap(b,S,t,{x:0,y:3,w:W,h:13},u);
    if(df>.93&&Math.floor(t/110)%2===0)for(let x=0;x<W;x++)for(let y=0;y<H;y++)b.set(x,y,RED,.18)}},

{ id:'split', title:'Cielo e infierno', 
  desc:'A la izquierda los hechos, ordenados y tranquilos; a la derecha los pendientes, cada vez más inquietos, con parpadeos y color de brasa.',
  pros:['Separa «lo logrado» de «lo que falta»','Proporción a la vista'], cons:['Menos espacio por zona'],
  render(b,S,t){const u=U(S.h),tot=S.n+S.d,wd=Math.max(7,Math.min(W-12,Math.round(W*S.d/tot)));
    if(S.d>0){const L=layoutCells(S.d,0,0,wd,H,5);for(let i=0;i<S.d;i++){const{x,y}=cellPos(L,i);b.rect(x,y,L.inner,L.inner,doneCol(t,i))}}
    for(let y=1;y<H-1;y++)b.set(wd+1,y,mixc(DIM,RED,u),.9);
    const x0=wd+3,L=layoutCells(S.n,x0,0,W-x0,H,5);
    S.p.forEach((h,i)=>{const{x,y}=cellPos(L,i);const fl=Math.random()<.04+.35*u?.2:1;b.rect(x,y,L.inner,L.inner,mul(pendCol(S,h,t,i,u),fl))})}},

{ id:'siren', title:'Sirena perimetral',
  desc:'Luces que dan vueltas por el borde de la matriz, cada vez más rápidas y más rojas. Dentro, el mapa del día.',
  pros:['Urgencia sin tapar los hábitos','Muy visible desde lejos'], cons:['Borde de 1 px: se nota solo en movimiento'],
  render(b,S,t){const u=U(S.h);
    drawMap(b,S,t,{x:2,y:2,w:W-4,h:H-4},u,{maxS:5});
    const per=2*(W+H)-4,pos=[];for(let x=0;x<W;x++)pos.push([x,0]);for(let y=1;y<H;y++)pos.push([W-1,y]);for(let x=W-2;x>=0;x--)pos.push([x,H-1]);for(let y=H-2;y>0;y--)pos.push([0,y]);
    const sp=(2+30*u)*S.sp,head=(t/1000*sp)%per,base=mixc([40,40,46],RED,Math.min(1,u*1.2));
    pos.forEach(([x,y],i)=>{const d=((head-i)%per+per)%per;const k=d<10?1-d/10:0;const lit=u<.25?.0:1;b.set(x,y,mixc(mul(base,.25),u>.9&&Math.floor(t/150)%2?WHITE:RED,k),lit)})}},

{ id:'ecg', title:'Pulso cardíaco',
  desc:'Un electrocardiograma recorre la parte superior y se acelera con el día. Debajo, el mapa de hechos y pendientes.',
  pros:['Sensación de «vivo» y de prisa','Compacto'], cons:['El mapa queda en 10 filas'],
  render(b,S,t){const u=U(S.h),per=Math.round(28-15*u),sp=(8+30*u)*S.sp,shape=[0,0,0,1,0,-1,-6,4,-1,0,0,1,1,0];
    let prev=null;for(let x=0;x<W;x++){const p=(Math.floor(x+t/1000*sp))%per,y=3+(p<shape.length?shape[p]:0)*.7;
      const c=mixc([60,230,110],RED,Math.min(1,u*1.15));b.set(x,Math.round(Math.max(0,Math.min(5,y))),c);
      if(prev!==null){const a=Math.round(Math.max(0,Math.min(5,y)));for(let yy=Math.min(a,prev);yy<=Math.max(a,prev);yy++)b.set(x,yy,mul(c,.7))}prev=Math.round(Math.max(0,Math.min(5,y)))}
    drawMap(b,S,t,{x:0,y:7,w:W,h:9},u,{maxS:4})}}
];

/* ================= UI ================= */
const grid=document.getElementById('grid');
const S={n:9,d:6,h:21,sp:1,p:[],t:0};
S.p=SAMPLE.slice(0,S.n);
const cards=STYLES.map(st=>{
  const el=document.createElement('section');el.className='card';
  el.innerHTML=`<canvas width="${W*P}" height="${H*P}"></canvas>
    <h2><span>${st.star?'<span class="star">★</span> ':''}${st.title}</span></h2>
    <p>${st.desc}</p>
    <div class="tags">${st.pros.map(x=>`<span class="tag good">+ ${x}</span>`).join('')}${st.cons.map(x=>`<span class="tag bad">− ${x}</span>`).join('')}</div>`;
  grid.appendChild(el);
  const cv=el.querySelector('canvas');
  return {st,cv,ctx:cv.getContext('2d'),buf:new Buf(),state:{},vis:true};
});
const io=new IntersectionObserver(es=>es.forEach(e=>{const c=cards.find(c=>c.cv===e.target.querySelector('canvas'));if(c)c.vis=e.isIntersecting}));
document.querySelectorAll('.card').forEach(c=>io.observe(c));
function paint(c){
  const{ctx,buf}=c;ctx.fillStyle='#050505';ctx.fillRect(0,0,W*P,H*P);const d=buf.d;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*W+x)*3,r=Math.min(255,d[i]),g=Math.min(255,d[i+1]),bl=Math.min(255,d[i+2]),cx=x*P+P/2,cy=y*P+P/2;
    if(r+g+bl<18){ctx.fillStyle='#111214';ctx.beginPath();ctx.arc(cx,cy,P*.36,0,6.283);ctx.fill();continue}
    const col=`${r|0},${g|0},${bl|0}`;
    ctx.fillStyle=`rgba(${col},.18)`;ctx.beginPath();ctx.arc(cx,cy,P*.52,0,6.283);ctx.fill();
    ctx.fillStyle=`rgb(${col})`;ctx.beginPath();ctx.arc(cx,cy,P*.38,0,6.283);ctx.fill();}
}
let last=0;
function frame(ts){requestAnimationFrame(frame);if(ts-last<33)return;last=ts;
  if(playing){S.h=Math.min(24,S.h+0.012*S.sp*(33/33));if(S.h>=24)S.h=7;sync()}
  for(const c of cards){if(!c.vis)continue;c.buf.clear();c.st.render(c.buf,S,ts,c.state);paint(c)}}
requestAnimationFrame(frame);
const $=id=>document.getElementById(id);
const hh=h=>{const m=Math.round(h*60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function sync(){$('h').value=S.h;$('hO').textContent=hh(S.h)}
let playing=false;
$('n').oninput=e=>{S.n=+e.target.value;S.p=SAMPLE.slice(0,S.n);$('nO').textContent=S.n};
$('d').oninput=e=>{S.d=+e.target.value;$('dO').textContent=S.d};
$('h').oninput=e=>{playing=false;$('play').textContent='▶ Reproducir el día';S.h=+e.target.value;$('hO').textContent=hh(S.h)};
$('sp').oninput=e=>{S.sp=+e.target.value;$('spO').textContent=S.sp.toFixed(1)};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ Pausar':'▶ Reproducir el día';if(playing&&S.h>=23.9)S.h=7};
document.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>{playing=false;$('play').textContent='▶ Reproducir el día';S.h=+b.dataset.h;sync()});
</script>
</body>
