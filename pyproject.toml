[project]
name = "habits"
version = "0.1.0"
description = "Self-hosted habit tracker API with remote MCP and reminders"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "pydantic>=2.14.3",
    "argon2-cffi>=25.1",
    "uvicorn>=0.54",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-cov>=7.1.0", "ruff>=0.17.4"]

[project.scripts]
habits = "app.cli:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S"]
ignore = ["S101", "E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tests_ha/*" = ["S"]

[tool.coverage.run]
source = ["app"]
branch = true
