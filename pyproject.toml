[project]
name = "habits"
version = "0.1.0"
description = "Self-hosted habit tracker API with remote MCP and reminders"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic>=2.14",
    "argon2-cffi>=25.1",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]

[project.scripts]
habits = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
