[project]
name = "habits"
version = "0.1.0"
description = "Self-hosted habit tracker API with remote MCP and reminders"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "sqlalchemy[asyncio]>=2.1.8",  # sqladmin imports sqlalchemy.ext.asyncio, which needs greenlet
    "alembic>=1.20.1",
    "pydantic>=2.14.3",
    "argon2-cffi>=25.1",
    "uvicorn>=0.54",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "sqladmin>=0.32",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-cov>=7.1.0", "ruff>=0.17.4"]

[project.scripts]
habits = "app.cli:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
